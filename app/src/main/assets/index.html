<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
<title>Hikari</title>
<style>
:root{
  --phone:#0b141a; --header:#202c33; --panel:#2a3942; --text:#e9edef;
  --muted:#9eabb1; --accent:#128c7e; --me:#005c4b; --her:#202c33;
  --border:rgba(255,255,255,.08);
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#05080c;color:var(--text);font-family:Arial,Helvetica,sans-serif}
button,input,textarea{font:inherit}
body{display:grid;place-items:center;background:radial-gradient(circle at top,rgba(18,140,126,.16),transparent 35%),#05080c}
.phone{
  width:min(440px,100vw);
  height:100vh;
  height:100dvh;
  max-height:900px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  position:relative;
  background:var(--phone);
  border:1px solid rgba(255,255,255,.07);
  box-shadow:0 30px 90px rgba(0,0,0,.55);
}
.statusbar{height:28px;flex:0 0 28px;padding:6px 14px 0;display:flex;justify-content:space-between;align-items:flex-start;font-size:11px;color:#bcc7cc;background:var(--header)}
.status-icons{display:flex;align-items:center;gap:8px;height:16px}.signal{display:flex;align-items:flex-end;gap:2px;height:12px}.signal i{display:block;width:3px;border-radius:1px;background:#c7d2d7}.signal i:nth-child(1){height:4px}.signal i:nth-child(2){height:6px}.signal i:nth-child(3){height:9px}.signal i:nth-child(4){height:12px}.battery{width:21px;height:10px;border:1.5px solid #c7d2d7;border-radius:2px;position:relative;overflow:hidden;box-sizing:border-box}.battery:after{content:'';position:absolute;right:-3px;top:2px;width:2px;height:5px;background:#c7d2d7;border-radius:0 1px 1px 0}.battery-fill{display:block;position:absolute;left:1px;top:1px;height:calc(100% - 2px);width:0;background:#c7d2d7;border-radius:1px;max-width:calc(100% - 2px);transition:width .25s ease,opacity .25s ease}
.header{height:64px;flex:0 0 64px;padding:8px 12px;display:flex;align-items:center;gap:10px;background:var(--header);border-bottom:1px solid var(--border)}
.back{font-size:24px;line-height:1;opacity:.85}
.portrait{
  width:44px;height:44px;flex:0 0 44px;border-radius:50%;overflow:hidden;position:relative;
  background:transparent;border:0;display:grid;place-items:center
}
.portrait img{width:100%;height:100%;display:block;object-fit:cover;object-position:center;filter:none;background:transparent}
.identity{min-width:0;flex:1}
.identity strong{display:block;font-size:16px}
.identity span{display:block;font-size:12px;color:#b9c4c9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-actions{display:flex;gap:15px;font-size:20px}.icon{border:0;background:none;color:inherit;cursor:pointer;padding:3px}
.chat{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:linear-gradient(rgba(11,20,26,.88),rgba(11,20,26,.92)),url('https://images.unsplash.com/photo-1515405295579-ba7b45403062?auto=format&fit=crop&w=1000&q=80') center/cover;
}
.messages{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:8px 12px 14px;scrollbar-width:thin}
.day{display:flex;justify-content:center;margin:7px 0 11px}.day span{padding:6px 10px;border-radius:7px;background:rgba(17,27,33,.78);font-size:11px;color:#c8d1d5}
.row{display:flex;margin:6px 0}.row.me{justify-content:flex-end}
.bubble{max-width:82%;padding:8px 10px 6px;border-radius:8px;font-size:14px;line-height:1.42;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 1px 0 rgba(0,0,0,.25)}
.row.me .bubble{background:var(--me);border-top-right-radius:0}.row.her .bubble{background:var(--her);border-top-left-radius:0}
.bubble.voice{width:min(285px,82%);padding:9px 10px 7px;white-space:normal}
.voice-player{display:grid;grid-template-columns:38px 1fr;gap:9px;align-items:center;min-width:220px}
.voice-play{width:38px;height:38px;border:0;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;font-size:16px;cursor:pointer;padding:0}
.voice-play:active{transform:scale(.96)}
.voice-main{min-width:0}.voice-label{font-size:12px;font-weight:700;margin-bottom:6px;color:#e9edef}
.voice-wave{height:20px;display:flex;align-items:center;gap:2px;position:relative;overflow:hidden;border-radius:8px;cursor:pointer}
.voice-wave i{display:block;width:3px;border-radius:4px;background:#9fb0b6;opacity:.65;flex:0 0 3px}
.voice-wave i:nth-child(4n+1){height:7px}.voice-wave i:nth-child(4n+2){height:14px}.voice-wave i:nth-child(4n+3){height:19px}.voice-wave i:nth-child(4n){height:11px}
.voice-progress{position:absolute;left:0;top:0;bottom:0;width:0;overflow:hidden;pointer-events:none;display:flex;align-items:center;gap:2px}
.voice-progress i{background:#25d366;opacity:1}
.voice-foot{display:flex;justify-content:space-between;gap:10px;margin-top:4px;color:#bdc9c7;font-size:10px}.voice-status{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bubble.note,.bubble.file{padding:0;overflow:hidden;white-space:normal;min-width:min(290px,78vw)}
.attachment-card{display:flex;align-items:center;gap:11px;padding:11px 12px;cursor:pointer;user-select:none}
.attachment-card:active{background:rgba(255,255,255,.045)}
.attachment-icon{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;flex:0 0 42px;background:rgba(255,255,255,.12);font-size:21px}
.attachment-copy{min-width:0;flex:1}.attachment-title{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.attachment-sub{font-size:11px;color:#bdc9c7;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.attachment-open{font-size:19px;color:#bdc9c7;flex:0 0 auto}
.attachment-body{display:none}.bubble.note .meta,.bubble.file .meta{padding:0 10px 7px;margin-top:-2px}
.content-viewer{max-height:65vh;overflow:auto;background:#0e171c;border:1px solid var(--border);border-radius:10px;padding:13px;margin-top:12px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;font-size:13px;color:#e6edef}
.viewer-meta{font-size:11px;color:#aebbc0;margin-top:4px}.relay-whisper{text-align:center;color:#8ba09f;font-size:11px;margin:7px auto;font-style:italic}
.meta{display:block;margin-top:3px;text-align:right;font-size:10px;color:#bdc9c7;opacity:.82}.typing{font-style:italic;opacity:.72}
.composer{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 9px calc(8px + env(safe-area-inset-bottom));background:var(--header);border-top:1px solid var(--border)}
.plus{font-size:23px;color:#b8c4c9;padding:8px 2px}
.inputwrap{flex:1;min-width:0;background:var(--panel);border-radius:23px;padding:0 13px;min-height:48px;max-height:120px;display:flex;align-items:center}
#chatInput{width:100%;height:22px;min-height:22px;max-height:96px;resize:none;overflow-y:auto;border:0;outline:0;background:transparent;color:var(--text);line-height:1.35;font-size:15px;padding:12px 0;display:block;-webkit-appearance:none;appearance:none}
#chatInput::placeholder{color:#9eabb1}
#send{width:44px;height:44px;flex:0 0 44px;border:0;border-radius:50%;background:var(--accent);color:white;font-size:18px;cursor:pointer}
.drawer{position:absolute;left:0;right:0;bottom:0;z-index:12;transform:translateY(100%);transition:.28s;background:#172229;border-radius:18px 18px 0 0;border-top:1px solid var(--border);box-shadow:0 -18px 40px rgba(0,0,0,.35);max-height:70%;overflow:auto;padding:15px;touch-action:pan-y}
.drawer.open{transform:translateY(0)}
.drawer-backdrop{position:absolute;inset:0;z-index:11;background:rgba(0,0,0,.34);opacity:0;pointer-events:none;transition:.2s}.drawer-backdrop.show{opacity:1;pointer-events:auto}
.drawer-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.drawer-title button{border:0;background:none;color:white;font-size:22px}
.meter{margin:10px 0}.meterhead{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}.bar{height:8px;border-radius:99px;background:#0c1317;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#128c7e,#25d366);width:0;transition:.3s}
.relay-control{width:100%;margin-top:16px;border:1px solid rgba(255,100,100,.28);background:rgba(120,25,30,.24);color:#ffd7d9;padding:11px 12px;border-radius:10px;cursor:pointer}.relay-control[hidden]{display:none!important}
.memory{font-size:12px;line-height:1.45;background:#0e171c;border-radius:10px;padding:10px;min-height:55px;color:#cbd6da}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{border:1px solid var(--border);background:var(--panel);color:white;padding:9px 11px;border-radius:9px}
.modalback{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(2,5,7,.7);backdrop-filter:blur(5px)}.modalback.show{display:flex}
.modal{width:100%;max-width:380px;background:#1d2a31;border-radius:15px;padding:17px;border:1px solid var(--border)}.modal h3{margin:0 0 6px}.modal p{font-size:12px;color:#b9c5ca;line-height:1.45}.modal label{display:block;font-size:12px;margin:10px 0 5px}.modal input{width:100%;padding:10px;border:1px solid var(--border);border-radius:9px;background:#0e171c;color:white}
.glitch{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:30;mix-blend-mode:screen}.glitching{animation:g .22s linear 3}@keyframes g{25%{opacity:.22;background:repeating-linear-gradient(0deg,transparent 0 5px,rgba(37,211,102,.2) 5px 7px)}50%{transform:translateX(4px)}75%{transform:translateX(-4px)}100%{opacity:0}}

.inbox-screen{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;background:var(--phone)}
.inbox-head{height:64px;flex:0 0 64px;padding:0 16px;display:flex;align-items:center;background:var(--header);border-bottom:1px solid var(--border)}
.inbox-head strong{font-size:20px;letter-spacing:.1px}
.chat-list{padding:8px 0;overflow-y:auto}
.chat-entry{width:100%;border:0;background:transparent;color:inherit;display:flex;align-items:center;gap:12px;padding:12px 16px;text-align:left;cursor:pointer}
.chat-entry:active{background:rgba(255,255,255,.045)}
.chat-entry .portrait{width:52px;height:52px;flex-basis:52px}
.chat-entry-copy{min-width:0;flex:1;border-bottom:1px solid var(--border);padding:4px 0 15px}
.chat-entry-line{display:flex;justify-content:space-between;gap:12px;align-items:center}
.chat-entry-line strong{font-size:16px}.chat-entry-time{font-size:11px;color:var(--muted)}
.chat-entry-preview{margin-top:5px;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.view-hidden{display:none!important}
.back{cursor:pointer;user-select:none}

@media(min-width:461px){.phone{border-radius:26px;height:min(900px,96dvh)}}
@media(max-width:460px){.phone{width:100vw;max-height:none;border:0;box-shadow:none}.statusbar{padding-top:max(7px,env(safe-area-inset-top));height:calc(28px + env(safe-area-inset-top));flex-basis:calc(28px + env(safe-area-inset-top))}}
</style>
</head>
